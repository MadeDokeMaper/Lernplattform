<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernreflexion · Binär & Rechner</title>
<style>
:root{--ink:#18232c;--muted:#607078;--paper:#f6f2ea;--card:#fffdf8;--navy:#173d4d;--teal:#087f8c;--coral:#e76f51;--line:#d8e0db;--ok:#176b55;--bad:#a63b38;--shadow:0 14px 35px #183b4e12}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--navy);color:#fff;padding:42px max(24px,calc((100% - 1180px)/2)) 38px;position:relative;overflow:hidden}.top:after{content:"01 · 07";position:absolute;right:4vw;bottom:-19px;font:bold 130px/1 Arial,sans-serif;color:#ffffff0d;letter-spacing:-.08em}.eyebrow,.task-meta,.section-kicker{font:700 12px/1.2 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}.eyebrow{color:#b7ddd9}.top h1{font-size:clamp(2.2rem,5vw,4.7rem);line-height:.95;max-width:800px;margin:16px 0 15px;font-weight:400;letter-spacing:-.04em}.top p{max-width:680px;color:#dbe9e7;margin:0;font-size:1.08rem}.shell{max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:grid;grid-template-columns:270px 1fr;gap:34px}.side{position:sticky;top:18px;align-self:start}.side h2,.section h2{font-size:1.45rem;margin:0 0 12px;font-weight:400}.overall{font:700 14px Arial,sans-serif;color:var(--navy);margin:0 0 9px}.progress{height:9px;background:#dce4df;border-radius:9px;overflow:hidden;margin:10px 0 6px}.bar{height:100%;background:var(--coral);width:0;transition:width .35s ease}.progress-label,.stat{color:var(--muted);font:13px Arial,sans-serif}.navgroup{margin-top:25px}.navgroup strong{display:block;font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);margin-bottom:8px}.navlink{display:block;color:var(--ink);text-decoration:none;padding:8px 10px;border-left:3px solid transparent;font-size:.95rem}.navlink:hover,.navlink:focus{border-left-color:var(--coral);background:#fff}.reset{margin-top:22px;border:1px solid var(--navy);background:transparent;color:var(--navy);padding:9px 12px;border-radius:5px}.reset:hover{background:var(--navy);color:#fff}.section{margin-bottom:43px;scroll-margin-top:18px}.section-header{border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:18px}.section-kicker{color:var(--coral)}.section h2{margin-top:4px}.section-intro{color:var(--muted);margin:0}.competency{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:19px 21px 22px;margin:16px 0;box-shadow:var(--shadow)}.competency h3{font-size:1.16rem;font-weight:400;margin:0;color:var(--navy)}.competency h3:before{content:"✓ ";color:var(--coral);font:700 1rem Arial,sans-serif}.competency-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.score{font:700 12px Arial,sans-serif;color:var(--teal);white-space:nowrap}.task{border-top:1px dashed var(--line);padding:17px 0 4px;margin-top:15px}.task-meta{color:var(--teal);margin-bottom:6px}.task p{margin:5px 0 10px}.choices{display:grid;gap:8px}.choice{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}.choice:hover{border-color:var(--teal)}.choice input{margin-top:5px;accent-color:var(--teal)}.check,.new{border:0;color:#fff;padding:9px 14px;border-radius:5px;margin-top:10px}.check{background:var(--teal)}.new{background:var(--coral);margin-left:7px}.check:hover,.new:hover{background:var(--navy)}input[type=text],textarea,select{width:100%;border:1px solid #b9c8c4;border-radius:5px;padding:9px;background:#fffdfb}textarea{min-height:88px;resize:vertical}.feedback{min-height:1.5em;margin-top:9px;font-size:.94rem}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.feedback strong{font-weight:700}.tip{background:#edf5f1;border-left:4px solid var(--teal);padding:9px 12px;color:#35534d;font-size:.92rem;margin-top:10px}.code-table{border-collapse:collapse;margin:10px 0;background:#fff}.code-table th,.code-table td{border:1px solid var(--line);padding:5px 10px;text-align:center}.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reflection{border-top:1px dashed var(--line);padding:17px 0 4px;margin-top:15px}.reflection h4{font-size:1rem;font-weight:400;margin:0 0 6px;color:var(--navy)}.reflection legend{font-weight:700;color:var(--teal);font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}.reflection fieldset{border:0;padding:0;margin:10px 0}.reflection .choice{display:inline-flex;margin:0 8px 8px 0;padding:7px 10px}.reflection textarea{min-height:150px}.hint-list{margin:10px 0 0;padding:10px 12px 10px 28px;background:#edf5f1;border-left:4px solid var(--teal);color:#35534d;font-size:.92rem}.match label{font-size:.95rem}.footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.9rem}@media(max-width:800px){.shell{display:block;padding:22px 16px 60px}.side{position:static;margin-bottom:32px}.top{padding:32px 18px}.top:after{font-size:70px}.match{grid-template-columns:1fr}.competency{padding:16px}.navgroup{display:none}.competency-head{display:block}.score{margin-top:8px}}
</style>
</head>
<body>
<header class="top"><div class="eyebrow">Lernreflexion · Informatik</div><h1>Was kann ich lernen für den Test?</h1><p>Sieben Kompetenzen, unendlich viele neue Aufgaben. Jede Aufgabe wird lokal in diesem Browser geprüft; dein Lernfortschritt bleibt erhalten.</p></header>
<div class="shell"><aside class="side" aria-label="Übersicht und Fortschritt"><h2>Dein Lernweg</h2><div class="overall" id="overall">0 % richtig</div><div class="progress" aria-label="Fortschritt"><div class="bar" id="bar"></div></div><div class="progress-label" id="progressText">0 von 0 Versuchen</div><div id="nav"></div><button class="reset" id="reset" type="button">Fortschritt zurücksetzen</button></aside><main id="app"></main></div>
<script>
/* Fachlich geschlossene Aufgabengeneratoren. Jede Aufgabe trägt eine eindeutige
   Signatur; die zuletzt gesehenen Signaturen werden gespeichert, damit ein Klick
   auf „Neue Aufgabe“ nicht direkt dieselbe Aufgabe zeigt. */
const COMPETENCIES=[
 {id:'dezimal-binaer',title:'Ich kann Dezimalzahlen in Binärzahlen umwandeln und anders herum.',group:'Binärzahlen',make:genConversion},
 {id:'addition',title:'Ich kann Binärzahlen addieren.',group:'Binärzahlen',make:genAddition},
 {id:'speicherbedarf',title:'Ich kann den Speicherbedarf einer Zahl ermitteln.',group:'Binärzahlen',make:genMemory},
 {id:'grenzen',title:'Ich kann an einem Beispiel erläutern, worin die Grenzen der Binärdarstellung liegen.',group:'Binärzahlen',make:genLimits},
 {id:'codierung',title:'Ich kann Informationen mithilfe von Binärzahlen codieren und decodieren.',group:'Binärzahlen',make:genCoding},
 {id:'bestandteile',title:'Ich kann die Bestandteile eines von-Neumann-Rechners benennen.',group:'Von-Neumann-Rechner',make:genVonNeumann},
 {id:'zuordnung',title:'Ich kann die Bauteile eines PCs (RAM, CPU, Monitor, Maus, …) den Bestandteilen des von-Neumann-Rechners zuordnen.',group:'Von-Neumann-Rechner',make:genParts}
];
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function bits(n,w){return n.toString(2).padStart(w,'0')}
function norm(v){return String(v??'').trim().toLowerCase().replace(/[₂_\s]/g,'')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function genConversion(){const w=randInt(4,8),n=randInt(1,2**w-1),reverse=Math.random()<.5;return reverse?{kind:'fill',q:`Wandle ${bits(n,w)}₂ in eine Dezimalzahl um.`,answer:String(n),solution:`Jede 1 steht für eine Zweierpotenz; die Summe ergibt ${n}.`,sig:`r-${w}-${n}`}:{kind:'fill',q:`Wandle ${n}₁₀ in eine ${w}-Bit-Binärzahl um.`,answer:bits(n,w),solution:`${n} wird durch wiederholte Division durch 2 bzw. über Zweierpotenzen zu ${bits(n,w)}₂.`,sig:`d-${w}-${n}`}}
function genAddition(){const w=randInt(4,8),a=randInt(1,2**w-2),b=randInt(1,2**w-1-a),sum=a+b;return {kind:'fill',q:`Addiere ${bits(a,w)}₂ + ${bits(b,w)}₂. Gib das Ergebnis ohne Index ein.`,answer:sum.toString(2),solution:`${a} + ${b} = ${sum}; binär ist das ${sum.toString(2)}₂.`,sig:`${w}-${a}-${b}`}}
function genMemory(){if(Math.random()<.5){const k=randInt(3,10);return {kind:'mc',q:`Wie viele verschiedene Bitmuster gibt es bei ${k} Bit?`,options:[String(2**(k-1)),String(2**k),String(k*2),String(2**k+1)],answer:1,solution:`Mit k Bit gibt es 2ᵏ = 2^${k} = ${2**k} Muster.`,sig:`count-${k}`}}const n=randInt(1,1023),w=Math.ceil(Math.log2(n+1));return {kind:'fill',q:`Wie viele Bit braucht die kleinste Binärdarstellung der positiven Zahl ${n}?`,answer:String(w),solution:`${n} liegt zwischen 2^${w-1} und 2^${w}-1; deshalb sind ${w} Bit nötig.`,sig:`bits-${n}`}}
function genLimits(){const w=randInt(3,8),max=2**w-1,a=randInt(Math.ceil(max/2),max),b=randInt(max-a+1,max);return {kind:'mc',q:`Bei einer festen Breite von ${w} Bit ohne Vorzeichen wird ${bits(a,w)}₂ + ${bits(b,w)}₂ gerechnet. Was ist die fachlich richtige Aussage?`,options:[`Das Ergebnis ${a+b} ist mit ${w} Bit darstellbar.`,`Es entsteht ein Überlauf: ${a+b} ist größer als ${max}.`,`Es gibt nur ${w} mögliche Werte.`,`Binärzahlen können nicht addiert werden.`],answer:1,solution:`${w} Bit ohne Vorzeichen stellen 0 bis ${max} dar. ${a+b} überschreitet ${max}; das ist ein Überlauf.`,sig:`${w}-${a}-${b}`}}
function codeTable(map){return `<table class="code-table"><caption>Code-Tabelle (A=1, 5 Bit)</caption><tr>${map.map(x=>`<th>${x.letter}</th>`).join('')}</tr><tr>${map.map(x=>`<td>${x.code}</td>`).join('')}</tr></table>`}
function genCoding(){const letters=['A','B','C','D','E','F','G','H'],map=letters.map((l,i)=>({letter:l,code:bits(i+1,5)}));if(Math.random()<.5){const word=shuffle(letters).slice(0,randInt(2,4)).join('');return {kind:'fill',q:`Codiere das Wort „${word}“ als Bitfolge (5 Bit je Buchstabe, ohne Trennzeichen).`,html:codeTable(map),answer:word.split('').map(l=>map.find(x=>x.letter===l).code).join(''),solution:`${word} wird Buchstabe für Buchstabe codiert; Ergebnis: ${word.split('').map(l=>map.find(x=>x.letter===l).code).join('')}.`,sig:`enc-${word}`}}const word=shuffle(letters).slice(0,randInt(2,4)).join(''),code=word.split('').map(l=>map.find(x=>x.letter===l).code).join('');return {kind:'fill',q:`Decodiere diese Bitfolge (5 Bit je Buchstabe): ${code}`,html:codeTable(map),answer:word,solution:`In 5er-Gruppen gelesen ergibt die Folge ${word}.`,sig:`dec-${code}`}}
function genVonNeumann(){const q=shuffle([{q:'Welcher Bestandteil führt Rechen- und logische Operationen aus?',a:'Rechenwerk',why:'Das Rechenwerk führt Rechen- und logische Operationen aus.'},{q:'Welcher Bestandteil koordiniert und steuert die Abläufe?',a:'Steuerwerk',why:'Das Steuerwerk steuert und koordiniert die Abläufe.'},{q:'Welcher Bestandteil bewahrt Programme und Daten auf?',a:'Speicher',why:'Der Speicher bewahrt Programme und Daten auf.'},{q:'Welcher Bestandteil nimmt Daten oder Befehle auf?',a:'Eingabewerk',why:'Das Eingabewerk nimmt Daten oder Befehle auf.'},{q:'Welcher Bestandteil gibt Ergebnisse an die Außenwelt aus?',a:'Ausgabewerk',why:'Das Ausgabewerk gibt Ergebnisse aus.'}])[0];return {kind:'mc',q:q.q,options:shuffle(['Rechenwerk','Steuerwerk','Speicher','Eingabewerk','Ausgabewerk']),answer:null,correctText:q.a,solution:q.why,sig:q.a+'-'+q.q}}
function genParts(){const pool=[['Maus','Eingabewerk'],['Tastatur','Eingabewerk'],['Mikrofon','Eingabewerk'],['Scanner','Eingabewerk'],['Monitor','Ausgabewerk'],['Drucker','Ausgabewerk'],['Lautsprecher','Ausgabewerk'],['Beamer','Ausgabewerk'],['CPU','Rechenwerk und Steuerwerk'],['RAM','Speicher'],['Mainboard-Busse','Bussystem']];const p=pool[randInt(0,pool.length-1)];const opts=shuffle(Array.from(new Set(pool.map(x=>x[1]))));const answer=opts.indexOf(p[1]);return {kind:'mc',q:`Ordne das PC-Bauteil „${p[0]}“ einem Bestandteil zu.`,options:opts,answer:answer,solution:`${p[0]} gehört hier zum ${p[1]}.`,sig:p[0]+'-'+p[1]};}

const STORE='lernreflexion-informatik-v2';let state=JSON.parse(localStorage.getItem(STORE)||'{}');
// Migration: Alte bearbeitete Aufgaben bleiben als richtige Versuche erhalten.
if(!Object.keys(state).length){const old=JSON.parse(localStorage.getItem('lernreflexion-informatik-v1')||'{}');for(const c of COMPETENCIES){const n=Object.keys(old).filter(k=>k.startsWith(c.id+'-')&&old[k]).length;if(n)state[c.id]={attempted:n,correct:n,seen:[]};}}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fresh(c){const s=state[c.id]||{};let t;do{t=c.make()}while(s.seen&&s.seen.includes(t.sig));return t}
function taskHTML(c,t){const id='task-'+c.id;let input='';if(t.kind==='mc')input=`<div class="choices">${t.options.map((o,i)=>`<label class="choice"><input type="radio" name="${id}" value="${i}"> ${esc(o)}</label>`).join('')}</div>`;else input=`<input type="text" id="input-${id}" aria-label="Antwort">`;return `<div class="task" id="${id}"><div class="task-meta">Neue Zufallsaufgabe</div><p>${esc(t.q)}</p>${t.html||''}${input}<button class="check" type="button" data-check="${c.id}">Prüfen</button><button class="new" type="button" data-new="${c.id}">Neue Aufgabe</button><div class="feedback" id="feedback-${c.id}" aria-live="polite"></div></div>`}
function reflectionHTML(){const saved=localStorage.getItem('lernreflexion-grenzen-beispiel')||'',choice=localStorage.getItem('lernreflexion-grenzen-typ')||'kommazahl';return `<div class="reflection" id="reflection-grenzen"><h4>Eigenes Beispiel erläutern</h4><p><strong>Aufgabe:</strong> Wähle ein Beispiel und erkläre in eigenen Worten, worin die Grenzen der Binärdarstellung sichtbar werden. Nutze dabei möglichst einen konkreten Sachverhalt.</p><fieldset><legend>Beispiel auswählen</legend><label class="choice"><input type="radio" name="reflection-type" value="kommazahl" ${choice==='kommazahl'?'checked':''}> Kommazahl</label><label class="choice"><input type="radio" name="reflection-type" value="musik" ${choice==='musik'?'checked':''}> Musik-Datei</label></fieldset><label for="reflection-text">Deine Erklärung</label><textarea id="reflection-text" placeholder="Schreibe hier deine Erklärung …">${esc(saved)}</textarea><button class="check" type="button" id="show-reflection-hints">Beispiel-Hinweise anzeigen</button><div id="reflection-hints" hidden><ul class="hint-list"><li>Kommazahl: Überlege, ob die Zahl mit endlich vielen Binärstellen exakt darstellbar ist und welche Rundungsfehler bei einer begrenzten Bitanzahl entstehen können.</li><li>Musik-Datei: Beziehe Abtastung (Samplingrate) und Bit-Tiefe bei der Digitalisierung eines analogen Signals ein.</li><li>Erkläre, wie eine endliche Darstellung bzw. Auswahl von Messwerten die Genauigkeit oder Qualität begrenzen kann.</li></ul></div></div>`}
function makeCard(c){const t=fresh(c);state[c.id]=state[c.id]||{attempted:0,correct:0,seen:[]};state[c.id].current=t;state[c.id].seen=state[c.id].seen||[];return `<article class="competency" id="${c.id}"><div class="competency-head"><h3>${esc(c.title)}</h3><div class="score" id="score-${c.id}"></div></div>${taskHTML(c,t)}${c.id==='grenzen'?reflectionHTML():''}</article>`}
function render(){document.getElementById('nav').innerHTML=`<div class="navgroup"><strong>Kompetenzen</strong>${COMPETENCIES.map(c=>`<a class="navlink" href="#${c.id}">${esc(c.title)}</a>`).join('')}</div>`;document.getElementById('app').innerHTML=COMPETENCIES.map((c,i)=>`<section class="section" id="section-${c.id}">${i===0?'<div class="section-header"><div class="section-kicker">7 Kompetenzen · Zufallsgenerator</div><h2>Üben, prüfen, weiterdenken</h2><p class="section-intro">Bearbeite eine Aufgabe, lies bei Fehlern den Lösungsweg und hole dir danach eine neue Variante.</p></div>':''}${i===5?'<div class="section-header"><div class="section-kicker">Von-Neumann-Rechner</div><h2>Aufbau und Zuordnung</h2><p class="section-intro">Ein- und Ausgabewerk, Rechenwerk, Steuerwerk, Speicher und Bussystem.</p></div>':''}${makeCard(c)}</section>`).join('');persist();updateScores()}
function persist(){localStorage.setItem(STORE,JSON.stringify(state))}
function updateScores(){let attempts=0,correct=0;COMPETENCIES.forEach(c=>{const s=state[c.id]||{};attempts+=s.attempted||0;correct+=s.correct||0;const e=document.getElementById('score-'+c.id);if(e)e.textContent=`${s.correct||0} richtig · ${s.attempted||0} versucht`});document.getElementById('bar').style.width=(attempts?Math.min(100,correct/attempts*100):0)+'%';document.getElementById('progressText').textContent=`${correct} von ${attempts} Versuchen richtig`;document.getElementById('overall').textContent=attempts?`${Math.round(correct/attempts*100)} % richtig`:'0 % richtig'}
function feedback(c,ok){const t=state[c.id].current,el=document.getElementById('feedback-'+c.id);el.className='feedback '+(ok?'ok':'bad');el.innerHTML=ok?`✓ Richtig! ${esc(t.solution)}`:`Noch nicht richtig. <strong>Lösungsweg:</strong> ${esc(t.solution)}`}
document.addEventListener('input',e=>{if(e.target.id==='reflection-text')localStorage.setItem('lernreflexion-grenzen-beispiel',e.target.value)});document.addEventListener('change',e=>{if(e.target.name==='reflection-type')localStorage.setItem('lernreflexion-grenzen-typ',e.target.value)});document.addEventListener('click',e=>{if(e.target.id==='show-reflection-hints'){const box=document.getElementById('reflection-hints');box.hidden=!box.hidden;e.target.textContent=box.hidden?'Beispiel-Hinweise anzeigen':'Beispiel-Hinweise ausblenden';return}const cid=e.target.dataset.check||e.target.dataset.new;if(!cid)return;const c=COMPETENCIES.find(x=>x.id===cid),s=state[cid];if(e.target.dataset.new){s.seen.push(s.current.sig);if(s.seen.length>100)s.seen.shift();s.current=fresh(c);persist();document.querySelector('#'+cid+' .task').outerHTML=taskHTML(c,s.current);updateScores();return}let ok=false,t=s.current;if(t.kind==='mc'){const v=document.querySelector(`input[name="task-${cid}"]:checked`);ok=!!v&&(t.answer===null?v&&t.options[+v.value]===t.correctText:+v.value===t.answer)}else ok=norm(document.getElementById('input-task-'+cid).value)===norm(t.answer);s.attempted=(s.attempted||0)+1;if(ok)s.correct=(s.correct||0)+1;persist();feedback(c,ok);updateScores()});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Gespeicherten Fortschritt wirklich löschen?')){state={};localStorage.removeItem(STORE);render()}});render();
</script>

</body></html>
