<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Anpassbares Gitter</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        padding: 20px;
    }

    h1 {
        color: #333;
    }

    #controls {
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        align-items: center;
    }

    #controls label {
        font-weight: bold;
        color: #333;
    }

    #controls input[type="number"] {
        width: 60px;
        padding: 5px;
        font-size: 15px;
    }

    #controls button {
        padding: 8px 18px;
        font-size: 15px;
        font-weight: bold;
        color: white;
        background-color: #1565C0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #controls button:hover {
        background-color: #0D47A1;
    }

    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    #info {
        margin: 15px 0;
        font-size: 18px;
        font-weight: bold;
        color: #333;
    }

    #hoverInfo {
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: bold;
        color: #1565C0;
        height: 22px;
    }

    #gridWrapper {
        display: inline-block;
        margin: 20px auto;
        overflow-x: auto;
        max-width: 100%;
    }

    .grid-container {
        display: grid;
        gap: 4px;
        justify-content: center;
    }

    .label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #555;
        font-size: 14px;
        line-height: 1.1;
    }

    .label .binval {
        font-size: 11px;
        color: #888;
        font-weight: normal;
    }

    .cell {
        width: 50px;
        height: 50px;
        background-color: #fff;
        border: 2px solid #999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        border-radius: 6px;
        transition: background-color 0.2s, transform 0.1s;
    }

    .cell:hover {
        background-color: #e0e0e0;
    }

    .cell.active {
        background-color: #4CAF50;
        color: white;
        border-color: #388E3C;
    }

    .cell:active {
        transform: scale(0.95);
    }

    #resetBtn {
        margin-top: 15px;
        padding: 10px 25px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background-color: #e53935;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    #resetBtn:hover {
        background-color: #c62828;
    }

    #resetBtn:active {
        transform: scale(0.97);
    }
</style>
</head>
<body>

<h1>Anpassbares Gitter</h1>

<div id="controls">
    <div>
        <label for="colsInput">Spalten (X):</label>
        <input type="number" id="colsInput" min="1" max="26" value="10">
    </div>
    <div>
        <label for="rowsInput">Zeilen (Y):</label>
        <input type="number" id="rowsInput" min="1" max="50" value="10">
    </div>
    <div class="checkbox-group">
        <input type="checkbox" id="binaryToggle">
        <label for="binaryToggle">Binäre Wertigkeit anzeigen (ab C)</label>
    </div>
    <button id="generateBtn">Gitter erzeugen</button>
</div>

<div id="info">0 / 100 aktiv</div>
<div id="hoverInfo">&nbsp;</div>

<div id="gridWrapper">
    <div class="grid-container" id="grid"></div>
</div>

<br>
<button id="resetBtn">Alle zurücksetzen</button>

<script>
    const grid = document.getElementById('grid');
    const info = document.getElementById('info');
    const hoverInfo = document.getElementById('hoverInfo');
    const resetBtn = document.getElementById('resetBtn');
    const generateBtn = document.getElementById('generateBtn');
    const colsInput = document.getElementById('colsInput');
    const rowsInput = document.getElementById('rowsInput');
    const binaryToggle = document.getElementById('binaryToggle');

    let cols = 10;
    let rows = 10;

    function getColumnLabel(index) {
        // Excel-Style: A, B, ..., Z, AA, AB, ...
        let label = '';
        let n = index;
        while (n >= 0) {
            label = String.fromCharCode((n % 26) + 65) + label;
            n = Math.floor(n / 26) - 1;
        }
        return label;
    }

    function buildGrid() {
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `40px repeat(${cols}, 50px)`;
        grid.style.gridTemplateRows = `40px repeat(${rows}, 50px)`;

        const showBinary = binaryToggle.checked;

        // Ecke oben links
        const corner = document.createElement('div');
        corner.classList.add('label');
        grid.appendChild(corner);

        // Spalten-Kopfzeile
        for (let col = 0; col < cols; col++) {
            const label = document.createElement('div');
            label.classList.add('label');

            const letter = getColumnLabel(col);
            const letterSpan = document.createElement('div');
            letterSpan.textContent = letter;
            label.appendChild(letterSpan);

            // Binärwert ab Spalte C (Index 2): 1, 2, 4, 8, ...
            if (showBinary && col >= 2) {
                const power = col - 2;
                const value = Math.pow(2, power);
                const binSpan = document.createElement('div');
                binSpan.classList.add('binval');
                binSpan.textContent = `(${value})`;
                label.appendChild(binSpan);
            }

            grid.appendChild(label);
        }

        // Zeilen mit Label + Zellen
        for (let row = 0; row < rows; row++) {
            const rowLabel = document.createElement('div');
            rowLabel.classList.add('label');
            rowLabel.textContent = row + 1;
            grid.appendChild(rowLabel);

            for (let col = 0; col < cols; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.textContent = '0';
                cell.dataset.value = '0';

                const address = `${getColumnLabel(col)}${row + 1}`;
                cell.dataset.address = address;

                cell.addEventListener('mouseenter', () => {
                    hoverInfo.textContent = `Zelle: ${address}`;
                });

                cell.addEventListener('mouseleave', () => {
                    hoverInfo.innerHTML = '&nbsp;';
                });

                cell.addEventListener('click', () => {
                    if (cell.dataset.value === '0') {
                        cell.dataset.value = '1';
                        cell.textContent = '1';
                        cell.classList.add('active');
                    } else {
                        cell.dataset.value = '0';
                        cell.textContent = '0';
                        cell.classList.remove('active');
                    }
                    updateInfo();
                });

                grid.appendChild(cell);
            }
        }

        updateInfo();
    }

    function updateInfo() {
        const activeCount = document.querySelectorAll('.cell.active').length;
        info.textContent = `${activeCount} / ${cols * rows} aktiv`;
    }

    generateBtn.addEventListener('click', () => {
        let newCols = parseInt(colsInput.value);
        let newRows = parseInt(rowsInput.value);

        if (isNaN(newCols) || newCols < 1) newCols = 1;
        if (isNaN(newRows) || newRows < 1) newRows = 1;

        cols = newCols;
        rows = newRows;

        buildGrid();
    });

    binaryToggle.addEventListener('change', () => {
        buildGrid();
    });

    resetBtn.addEventListener('click', () => {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            cell.dataset.value = '0';
            cell.textContent = '0';
            cell.classList.remove('active');
        });
        updateInfo();
    });

    // Initiales Gitter erzeugen
    buildGrid();
</script>

</body>
</html>
