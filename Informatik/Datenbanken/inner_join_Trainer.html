const SYMBOLS = [
    "SELECT", "FROM", "INNER JOIN", "ON", "WHERE",
    "AND", "OR", "NOT", "LIKE",
    "=", "!=", "<", ">", "<=", ">=",
    "*", ".", ","
];

let currentTask = null;

/* ==========================================================
   TABELLEN RENDERN
   ========================================================== */

function renderTables() {
    const container = document.getElementById("tablesContainer");
    if (!container) return;

    let html = "";
    for (const tableName in DB) {
        const table = DB[tableName];
        html += `<div class="table-box"><h3>${tableName}</h3>`;
        html += renderDataTable(table.schema, table.rows);
        html += "</div>";
    }
    container.innerHTML = html;
}

function renderDataTable(schema, rows) {
    let html = "<table><thead><tr>";
    schema.forEach(col => {
        let cls = "";
        if (col.key === "pk") cls = "pk";
        else if (col.key === "fk") cls = "fk";
        const keyLabel = col.key === "pk" ? " (PK)" : (col.key === "fk" ? " (FK)" : "");
        html += `<th class="${cls}">${col.name}${keyLabel}<small>${col.type}</small></th>`;
    });
    html += "</tr></thead><tbody>";

    if (rows.length === 0) {
        html += `<tr><td colspan="${schema.length}"><em>Keine Datensätze</em></td></tr>`;
    } else {
        rows.forEach(row => {
            html += "<tr>";
            schema.forEach(col => {
                html += `<td>${row[col.name]}</td>`;
            });
            html += "</tr>";
        });
    }

    html += "</tbody></table>";
    return html;
}

function renderResultTable(result) {
    if (!result || !result.columns || result.columns.length === 0) {
        return "<p><em>Keine Spalten im Ergebnis.</em></p>";
    }
    let html = "<table><thead><tr>";
    result.columns.forEach(col => {
        html += `<th>${col}</th>`;
    });
    html += "</tr></thead><tbody>";

    if (result.rows.length === 0) {
        html += `<tr><td colspan="${result.columns.length}"><em>Keine Ergebniszeilen</em></td></tr>`;
    } else {
        result.rows.forEach(row => {
            html += "<tr>";
            result.columns.forEach(col => {
                html += `<td>${row[col]}</td>`;
            });
            html += "</tr>";
        });
    }

    html += "</tbody></table>";
    return html;
}

/* ==========================================================
   BUTTONS FÜR SYMBOLE
   ========================================================== */

function renderButtons() {
    const btnRow = document.getElementById("btnRow");
    btnRow.innerHTML = "";
    SYMBOLS.forEach(sym => {
        const btn = document.createElement("button");
        btn.className = "sym-btn";
        btn.textContent = sym;
        btn.onclick = () => insertAtCursor(sym);
        btnRow.appendChild(btn);
    });
}

function insertAtCursor(text) {
    const textarea = document.getElementById("queryInput");
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const before = textarea.value.substring(0, start);
    const after = textarea.value.substring(end);
    textarea.value = before + text + " " + after;
    const cursorPos = start + text.length + 1;
    textarea.focus();
    textarea.setSelectionRange(cursorPos, cursorPos);
}

/* ==========================================================
   SQL PARSER (SELECT / FROM / INNER JOIN / ON / WHERE)
   ========================================================== */

function parseSQL(query) {
    let q = query.trim().replace(/;\s*$/, "");
    if (q.length === 0) {
        throw new Error("Die Abfrage ist leer.");
    }

    // WHERE abtrennen
    let wherePart = null;
    const whereMatch = q.match(/^(.*?)\bWHERE\b(.*)$/is);
    let mainPart = q;
    if (whereMatch) {
        mainPart = whereMatch[1].trim();
        wherePart = whereMatch[2].trim();
    }

    // SELECT ... FROM ...
    const selectMatch = mainPart.match(/^SELECT\s+(.+?)\s+FROM\s+(.+)$/is);
    if (!selectMatch) {
        throw new Error("Die Abfrage muss die Form SELECT ... FROM ... haben.");
    }

    const columnsPart = selectMatch[1].trim();
    let fromPart = selectMatch[2].trim();

    // FROM-Teil in Basistabelle + JOINs zerlegen
    const joinRegex = /\bINNER\s+JOIN\b/i;
    const fromSegments = fromPart.split(joinRegex);

    const baseTableRaw = fromSegments[0].trim();
    const baseTableName = resolveTableName(baseTableRaw);
    if (!baseTableName) {
        throw new Error(`Unbekannte Tabelle "${baseTableRaw}".`);
    }

    // Aliase-Map: aktueller Tabellenname (so wie geschrieben) -> tatsächlicher Tabellenname
    const usedTables = [baseTableName];

    // Basiszeilen: jede Zeile bekommt Präfix pro Tabelle
    let joinedRows = DB[baseTableName].rows.map(row => {
        return { [baseTableName]: row };
    });

    // Joins abarbeiten
    for (let i = 1; i < fromSegments.length; i++) {
        const seg = fromSegments[i].trim();
        const onMatch = seg.match(/^(.+?)\s+ON\s+(.+)$/is);
        if (!onMatch) {
            throw new Error("Jeder INNER JOIN benötigt eine ON-Bedingung, z.B. INNER JOIN Tabelle ON A.Spalte = B.Spalte");
        }
        const joinTableRaw = onMatch[1].trim();
        const onCondition = onMatch[2].trim();

        const joinTableName = resolveTableName(joinTableRaw);
        if (!joinTableName) {
            throw new Error(`Unbekannte Tabelle "${joinTableRaw}" im JOIN.`);
        }

        const onParts = onCondition.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*([a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)$/);
        if (!onParts) {
            throw new Error("Die ON-Bedingung muss die Form Tabelle1.Spalte = Tabelle2.Spalte haben.");
        }

        const leftTable = resolveTableName(onParts[1]);
        const leftCol = onParts[2];
        const rightTable = resolveTableName(onParts[3]);
        const rightCol = onParts[4];

        if (!leftTable || !rightTable) {
            throw new Error("In der ON-Bedingung wird eine unbekannte Tabelle verwendet.");
        }

        const newJoinedRows = [];
        joinedRows.forEach(leftRow => {
            DB[joinTableName].rows.forEach(rightRow => {
                const combined = Object.assign({}, leftRow, { [joinTableName]: rightRow });

                const leftVal = combined[leftTable] ? combined[leftTable][leftCol] : undefined;
                const rightVal = combined[rightTable] ? combined[rightTable][rightCol] : undefined;

                if (leftVal !== undefined && rightVal !== undefined && leftVal === rightVal) {
                    newJoinedRows.push(combined);
                }
            });
        });

        joinedRows = newJoinedRows;
        usedTables.push(joinTableName);
    }

    // Flache Zeilen erzeugen für WHERE und SELECT (mit Kollisionsprüfung)
    const flatRows = joinedRows.map(combined => flattenRow(combined, usedTables));

    // WHERE anwenden
    let filteredRows = flatRows;
    if (wherePart) {
        filteredRows = flatRows.filter(row => evaluateWhere(wherePart, row, usedTables));
    }

    // Spalten auflösen
    let selectedColumns;
    if (columnsPart.trim() === "*") {
        selectedColumns = getAllColumnNames(usedTables, flatRows[0]);
    } else {
        selectedColumns = columnsPart.split(",").map(c => c.trim());
        selectedColumns = selectedColumns.map(col => resolveColumnName(col, usedTables));
    }

    const resultRows = filteredRows.map(row => {
        const newRow = {};
        selectedColumns.forEach(col => {
            newRow[col.label] = row[col.key];
        });
        return newRow;
    });

    return {
        columns: selectedColumns.map(c => c.label),
        rows: resultRows,
        tables: usedTables
    };
}

function resolveTableName(name) {
    const clean = name.trim();
    const found = Object.keys(DB).find(t => t.toLowerCase() === clean.toLowerCase());
    return found || null;
}

// Erzeugt ein flaches Objekt aus den kombinierten Tabellenzeilen,
// Schlüssel im Format "Tabelle.Spalte" um Kollisionen zu vermeiden
function flattenRow(combined, usedTables) {
    const flat = {};
    usedTables.forEach(t => {
        const row = combined[t];
        if (!row) return;
        DB[t].schema.forEach(col => {
            flat[`${t}.${col.name}`] = row[col.name];
        });
    });
    return flat;
}

function getAllColumnNames(usedTables, sampleFlatRow) {
    const cols = [];
    usedTables.forEach(t => {
        DB[t].schema.forEach(col => {
            cols.push({ key: `${t}.${col.name}`, label: col.name, table: t });
        });
    });
    return cols;
}

// Löst "Spalte" oder "Tabelle.Spalte" zu { key, label } auf,
// wirft Fehler bei Mehrdeutigkeit oder Unbekanntheit
function resolveColumnName(colExpr, usedTables) {
    if (colExpr.includes(".")) {
        const [tablePart, colPart] = colExpr.split(".").map(s => s.trim());
        const tableName = resolveTableName(tablePart);
        if (!tableName || !usedTables.includes(tableName)) {
            throw new Error(`Unbekannte oder nicht verwendete Tabelle "${tablePart}" in "${colExpr}".`);
        }
        const colDef = DB[tableName].schema.find(c => c.name.toLowerCase() === colPart.toLowerCase());
        if (!colDef) {
            throw new Error(`Unbekannte Spalte "${colPart}" in Tabelle "${tableName}".`);
        }
        return { key: `${tableName}.${colDef.name}`, label: colDef.name };
    } else {
        const matches = [];
        usedTables.forEach(t => {
            const colDef = DB[t].schema.find(c => c.name.toLowerCase() === colExpr.toLowerCase());
            if (colDef) {
                matches.push({ key: `${t}.${colDef.name}`, label: colDef.name, table: t });
            }
        });
        if (matches.length === 0) {
            throw new Error(`Unbekannte Spalte "${colExpr}".`);
        }
        if (matches.length > 1) {
            throw new Error(`Die Spalte "${colExpr}" ist mehrdeutig (kommt in mehreren Tabellen vor: ${matches.map(m => m.table).join(", ")}). Bitte mit Tabelle.Spalte angeben.`);
        }
        return { key: matches[0].key, label: matches[0].label };
    }
}

/* ==========================================================
   WHERE-AUSWERTUNG
   ========================================================== */

function evaluateWhere(whereStr, flatRow, usedTables) {
    // Tokenize grob nach AND/OR, unterstützt einfache Klammer-lose Ausdrücke
    // Wir ersetzen zuerst Bedingungen durch true/false, dann werten wir das Boolesche Ergebnis aus

    // Zuerst NOT am Anfang einzelner Bedingungen erkennen wir in evaluateCondition
    // Split nach OR (niedrigste Priorität), dann AND
    const orParts = splitTopLevel(whereStr, /\bOR\b/i);
    return orParts.some(andGroup => {
        const andParts = splitTopLevel(andGroup, /\bAND\b/i);
        return andParts.every(cond => evaluateSingleCondition(cond.trim(), flatRow, usedTables));
    });
}

function splitTopLevel(str, regex) {
    // Einfache Version ohne Klammerunterstützung
    return str.split(regex).map(s => s.trim()).filter(s => s.length > 0);
}

function evaluateSingleCondition(cond, flatRow, usedTables) {
    let negate = false;
    let c = cond.trim();
    if (/^NOT\s+/i.test(c)) {
        negate = true;
        c = c.replace(/^NOT\s+/i, "").trim();
    }

    let result;

    const likeMatch = c.match(/^(.+?)\s+LIKE\s+'(.*)'$/i);
    const opMatch = c.match(/^(.+?)\s*(!=|>=|<=|=|>|<)\s*(.+)$/);

    if (likeMatch) {
        const colExpr = likeMatch[1].trim();
        const pattern = likeMatch[2];
        const colInfo = resolveColumnName(colExpr, usedTables);
        const value = flatRow[colInfo.key];
        const regexPattern = "^" + pattern.replace(/%/g, ".*").replace(/_/g, ".") + "$";
        result = new RegExp(regexPattern, "i").test(String(value));
    } else if (opMatch) {
        const colExpr = opMatch[1].trim();
        const operator = opMatch[2];
        let rawValue = opMatch[3].trim();

        const colInfo = resolveColumnName(colExpr, usedTables);
        let value = flatRow[colInfo.key];

        let compareValue;
        if (/^'.*'$/.test(rawValue)) {
            compareValue = rawValue.slice(1, -1);
        } else if (!isNaN(Number(rawValue))) {
            compareValue = Number(rawValue);
            value = Number(value);
        } else {
            compareValue = rawValue;
        }

        switch (operator) {
            case "=": result = value === compareValue; break;
            case "!=": result = value !== compareValue; break;
            case ">": result = value > compareValue; break;
            case "<": result = value < compareValue; break;
            case ">=": result = value >= compareValue; break;
            case "<=": result = value <= compareValue; break;
            default: throw new Error(`Unbekannter Operator "${operator}".`);
        }
    } else {
        throw new Error(`Die Bedingung "${cond}" konnte nicht ausgewertet werden.`);
    }

    return negate ? !result : result;
}

/* ==========================================================
   ERGEBNISVERGLEICH
   ========================================================== */

function resultsAreEqual(resultA, resultB) {
    if (!resultA || !resultB) return false;
    const colsA = [...resultA.columns].sort();
    const colsB = [...resultB.columns].sort();
    if (colsA.length !== colsB.length) return false;
    for (let i = 0; i < colsA.length; i++) {
        if (colsA[i].toLowerCase() !== colsB[i].toLowerCase()) return false;
    }

    if (resultA.rows.length !== resultB.rows.length) return false;

    const normalize = (rows) => rows.map(row => {
        const sortedRow = {};
        Object.keys(row).sort().forEach(k => {
            sortedRow[k.toLowerCase()] = row[k];
        });
        return JSON.stringify(sortedRow);
    }).sort();

    const normA = normalize(resultA.rows);
    const normB = normalize(resultB.rows);

    for (let i = 0; i < normA.length; i++) {
        if (normA[i] !== normB[i]) return false;
    }
    return true;
}

/* ==========================================================

   ========================================================== */

const TASK_TEMPLATES = [
    {
        desc: "Zeige die Namen aller Kunden und das Datum ihrer Bestellungen (Kunden + Bestellungen verknüpfen).",
        query: "SELECT Kunden.Name, Bestellungen.Datum FROM Kunden INNER JOIN Bestellungen ON Kunden.KID = Bestellungen.KID"
    },
    {
        desc: "Zeige alle Bestellungen (BID, Datum) zusammen mit dem Namen des jeweiligen Kunden.",
        query: "SELECT Bestellungen.BID, Bestellungen.Datum, Kunden.Name FROM Bestellungen INNER JOIN Kunden ON Bestellungen.KID = Kunden.KID"
    },

    }
];

function newTask() {
    const template = TASK_TEMPLATES[Math.floor(Math.random() * TASK_TEMPLATES.length)];

    let targetResult;
    try {
        targetResult = parseSQL(template.query);
    } catch (e) {
        document.getElementById("task").textContent = "Fehler beim Laden der Aufgabe: " + e.message;
        return;
    }

    currentTask = {
        description: template.desc,
        solutionQuery: template.query,
        targetResult: targetResult
    };

    document.getElementById("task").textContent = currentTask.description;
    document.getElementById("targetResult").innerHTML = renderResultTable(targetResult);
    document.getElementById("queryInput").value = "";
    document.getElementById("feedback").className = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("ownResult").innerHTML = "";
    document.getElementById("solutionBox").style.display = "none";
}

/* ==========================================================
   ABFRAGE AUSFÜHREN UND BEWERTEN
   ========================================================== */

function runQuery() {
    const queryText = document.getElementById("queryInput").value;
    const feedbackEl = document.getElementById("feedback");
    const ownResultEl = document.getElementById("ownResult");

    let result;
    try {
        result = parseSQL(queryText);
    } catch (e) {
        feedbackEl.className = "feedback-error";
        feedbackEl.textContent = "⚠ Fehler in deiner Abfrage: " + e.message;
        ownResultEl.innerHTML = "<p><em>Kein Ergebnis aufgrund eines Fehlers.</em></p>";
        return;
    }

    ownResultEl.innerHTML = renderResultTable(result);

    if (!currentTask) {
        feedbackEl.className = "";
        feedbackEl.textContent = "";
        return;
    }

    const isCorrect = resultsAreEqual(result, currentTask.targetResult);

    if (isCorrect) {
        feedbackEl.className = "feedback-correct";
        feedbackEl.textContent = "✔ Richtig! Dein Ergebnis stimmt mit dem Zielergebnis überein.";
    } else {
        feedbackEl.className = "feedback-wrong";
        feedbackEl.textContent = "✘ Leider nicht ganz richtig. Vergleiche dein Ergebnis oben mit dem Zielergebnis.";
    }
}

/* ==========================================================
   MUSTERLÖSUNG ANZEIGEN
   ========================================================== */

function toggleSolution() {
    const box = document.getElementById("solutionBox");
    if (!currentTask) return;

    if (box.style.display === "none" || box.style.display === "") {
        box.style.display = "block";
        box.innerHTML = "<strong>Musterlösung:</strong><br>" + currentTask.solutionQuery;
    } else {
        box.style.display = "none";
    }
}

/* ==========================================================
   INITIALISIERUNG
   ========================================================== */

renderTables();
renderButtons();
newTask();

</script>
