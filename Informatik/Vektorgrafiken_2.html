<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG-Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      color: #20242a;
      background: #f4f6f8;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #d8dde3;
    }

    header h1 {
      margin: 0 auto 0 0;
      font-size: 18px;
    }

    button,
    .file-button {
      padding: 8px 12px;
      border: 1px solid #c7cdd4;
      border-radius: 6px;
      background: #fff;
      color: #20242a;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    .file-button:hover {
      background: #eef2f6;
    }

    #fileInput {
      display: none;
    }

    .split-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    #splitRange {
      width: 130px;
    }

    #workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 50% 6px 1fr;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .pane h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 14px;
      border-bottom: 1px solid #d8dde3;
    }

    #svgCode {
      flex: 1;
      width: 100%;
      resize: none;
      padding: 14px;
      border: 0;
      outline: none;
      color: #e5e7eb;
      background: #1e2229;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      tab-size: 2;
      white-space: pre;
    }

    #divider {
      cursor: col-resize;
      background: #d8dde3;
    }

    #divider:hover,
    #divider.dragging {
      background: #4385f5;
    }

    #preview {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
        linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
        linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    #preview svg {
      display: block;
      max-width: 100%;
      max-height: 100%;
      overflow: visible;
      filter: drop-shadow(0 2px 5px #0002);
    }

    #preview .selected {
      outline: 2px solid #4385f5;
      outline-offset: 2px;
    }

    footer {
      padding: 8px 14px;
      color: #58616d;
      background: #fff;
      border-top: 1px solid #d8dde3;
      font-size: 12px;
    }

    #status {
      margin-left: 8px;
    }

    @media (max-width: 700px) {
      #workspace {
        grid-template-columns: 50% 6px 1fr;
      }

      header h1 {
        width: 100%;
      }

      .split-control {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SVG-Editor</h1>

    <label class="file-button" for="fileInput">SVG laden</label>
    <input id="fileInput" type="file" accept=".svg,image/svg+xml">

    <button id="saveButton" type="button">SVG speichern</button>

    <label class="split-control" for="splitRange">
      Code / Vorschau
      <input id="splitRange" type="range" min="20" max="80" value="50">
      <span id="splitLabel">50 / 50</span>
    </label>
  </header>

  <main id="workspace">
    <section class="pane">
      <h2>SVG-Code</h2>
      <textarea id="svgCode" spellcheck="false" aria-label="SVG-Code"></textarea>
    </section>

    <div id="divider" role="separator" aria-label="Ansichtsbreite verändern"></div>

    <section class="pane">
      <h2>Vorschau – Elemente anklicken und ziehen</h2>
      <div id="preview"></div>
    </section>
  </main>

  <footer>
    Codeänderungen werden in der Vorschau angezeigt. In der Vorschau verschobene
    Elemente werden in den Code übernommen.
    <span id="status"></span>
  </footer>

  <script>
    const codeEditor = document.getElementById("svgCode");
    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("fileInput");
    const saveButton = document.getElementById("saveButton");
    const workspace = document.getElementById("workspace");
    const divider = document.getElementById("divider");
    const splitRange = document.getElementById("splitRange");
    const splitLabel = document.getElementById("splitLabel");
    const status = document.getElementById("status");

    let renderTimer;
    let selectedElement = null;
    let dragState = null;

    const exampleSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f4f6f8"/>
  <circle cx="170" cy="150" r="75" fill="#4385f5"/>
  <rect x="270" y="95" width="130" height="110" rx="16" fill="#f59e0b"/>
  <text x="250" y="275" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20242a">Klicke ein Element und ziehe es</text>
</svg>`;

    codeEditor.value = exampleSvg;
    renderPreview();

    function setSplit(value) {
      const leftPercent = Number(value);
      workspace.style.gridTemplateColumns = `${leftPercent}% 6px 1fr`;
      splitRange.value = leftPercent;
      splitLabel.textContent = `${leftPercent} / ${100 - leftPercent}`;
    }

    splitRange.addEventListener("input", () => setSplit(splitRange.value));

    divider.addEventListener("pointerdown", (event) => {
      divider.classList.add("dragging");
      divider.setPointerCapture(event.pointerId);
    });

    divider.addEventListener("pointermove", (event) => {
      if (!divider.classList.contains("dragging")) return;

      const rect = workspace.getBoundingClientRect();
      const percent = ((event.clientX - rect.left) / rect.width) * 100;
      setSplit(Math.max(20, Math.min(80, Math.round(percent))));
    });

    divider.addEventListener("pointerup", () => {
      divider.classList.remove("dragging");
    });

    codeEditor.addEventListener("input", () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderPreview, 250);
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      codeEditor.value = await file.text();
      renderPreview();
      status.textContent = `Geladen: ${file.name}`;
      fileInput.value = "";
    });

    function renderPreview() {
      selectedElement = null;
      preview.replaceChildren();

      const parser = new DOMParser();
      const doc = parser.parseFromString(codeEditor.value, "image/svg+xml");

      if (doc.querySelector("parsererror")) {
        status.textContent = "Ungültiger SVG-Code – bitte Syntax prüfen.";
        return;
      }

      const svg = doc.documentElement;
      if (svg.localName !== "svg") {
        status.textContent = "Die Datei enthält kein SVG-Wurzelelement.";
        return;
      }

      // Entfernt Skripte und Inline-Eventhandler aus der Vorschau.
      svg.querySelectorAll("script, foreignObject").forEach((node) => node.remove());
      svg.querySelectorAll("*").forEach((element) => {
        for (const attr of [...element.attributes]) {
          if (/^on/i.test(attr.name)) element.removeAttribute(attr.name);
        }
      });

      const importedSvg = document.importNode(svg, true);
      importedSvg.removeAttribute("onload");
      preview.appendChild(importedSvg);
      status.textContent = "";
    }

    function getSvgPoint(svg, event) {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(svg.getScreenCTM().inverse());
    }

    preview.addEventListener("pointerdown", (event) => {
      const target = event.target.closest("svg *");
      if (!target || target === preview.querySelector("svg")) return;

      if (selectedElement) selectedElement.classList.remove("selected");
      selectedElement = target;
      selectedElement.classList.add("selected");

      const svg = target.ownerSVGElement;
      const point = getSvgPoint(svg, event);
      const existing = target.getAttribute("transform") || "";
      const match = existing.match(/translate\(\s*([-.\d]+)[ ,]+([-.\d]+)\s*\)/);

      dragState = {
        target,
        svg,
        startX: point.x,
        startY: point.y,
        baseX: match ? Number(match[1]) : 0,
        baseY: match ? Number(match[2]) : 0,
        originalTransform: existing
      };

      target.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    preview.addEventListener("pointermove", (event) => {
      if (!dragState) return;

      const point = getSvgPoint(dragState.svg, event);
      const x = dragState.baseX + point.x - dragState.startX;
      const y = dragState.baseY + point.y - dragState.startY;

      const remaining = dragState.originalTransform
        .replace(/translate\(\s*[-.\d]+[ ,]+[-.\d]+\s*\)/, "")
        .trim();

      dragState.target.setAttribute(
        "transform",
        `translate(${x} ${y})${remaining ? " " + remaining : ""}`
      );
    });

    preview.addEventListener("pointerup", () => {
      if (!dragState) return;

      dragState = null;
      if (selectedElement) {
        selectedElement.classList.remove("selected");
        codeEditor.value = new XMLSerializer().serializeToString(
          preview.querySelector("svg")
        );
      }
    });

    saveButton.addEventListener("click", () => {
      const blob = new Blob([codeEditor.value], {
        type: "image/svg+xml;charset=utf-8"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "grafik.svg";
      link.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
